<!doctype html>
<html lang="en">
  <head>
    <title>Environment variables</title>
    <meta name="description" content="Original synthetic benchmark fixture" />
    <link
      rel="canonical"
      href="https://example.test/environment-variable-reference"
    />
  </head>
  <body>
    <header>Runtime Reference Commands Files Variables</header>
    <div class="reference-shell">
      <section class="reference-content">
        <h1>Environment variables</h1>
        <p>Set these values before the process starts.</p>
        <h2>Runtime variables</h2>
        <table>
          <thead>
            <tr>
              <th>Variable</th>
              <th>Default</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>NORTHSTAR_CACHE_DIR</code></td>
              <td><code>./cache</code></td>
              <td>Directory for reusable downloaded objects.</td>
            </tr>
            <tr>
              <td><code>NORTHSTAR_LOG</code></td>
              <td><code>info</code></td>
              <td>Minimum diagnostic level.</td>
            </tr>
          </tbody>
        </table>
      </section>
      <button>Copy all variable names</button>
    </div>
  </body>
</html>
