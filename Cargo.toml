[package]
name = "legible"
version = "0.5.1"
edition = "2024"
authors = ["Ryan Fowler"]
description = "Extract relevant content and metadata from HTML and render high-quality Markdown"
license = "Apache-2.0"
repository = "https://github.com/ryanfowler/legible"
documentation = "https://docs.rs/legible"
keywords = ["markdown", "content", "extraction", "html", "parser"]
categories = ["parsing", "text-processing", "web-programming"]
exclude = [".github/", "examples/", "tests/", "fuzz/"]

[lib]
bench = false

# Extraction is a cross-module hot path. Thin LTO keeps release builds
# linkable in a reasonable time while allowing the optimizer to inline the
# small DOM, scoring, and rendering helpers across module boundaries.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
# Benchmarks include html5ever and tendril in the hot path. Fat LTO lets the
# benchmark binary inline these boundaries for representative measurements.
lto = "fat"

[features]
default = []
fuzzing = []
tracing = ["dep:tracing"]

[dependencies]
caseless = "0.2"
html5ever = "0.39"
memchr = "2.8"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.15"
tendril = "0.5"
thiserror = "2.0"
tracing = { version = "0.1", optional = true }
url = "2.5"

[dev-dependencies]
criterion = "0.8"
datatest-stable = "0.3"
markup5ever_rcdom = "0.39"
pretty_assertions = "1.4"

[[test]]
name = "fixture_tests"
harness = false

[[test]]
name = "readability_compat_tests"
harness = false

[[bench]]
name = "smoke"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "corpus"
harness = false
