[package]
name = "legible"
version = "0.5.0"
edition = "2024"
authors = ["Ryan Fowler"]
description = "A Rust port of Mozilla's Readability.js for extracting readable content from web pages"
license = "Apache-2.0"
repository = "https://github.com/ryanfowler/legible"
documentation = "https://docs.rs/legible"
keywords = ["readability", "article", "extraction", "html", "parser"]
categories = ["parsing", "text-processing", "web-programming"]
exclude = [".github/", "examples/", "tests/"]

[lib]
bench = false

[features]
default = []
tracing = ["dep:tracing"]

[dependencies]
html5ever = "0.39"
memchr = "2.7"
once_cell = "1.21"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.15"
tendril = "0.5"
thiserror = "2.0"
tracing = { version = "0.1", optional = true }
url = "2.5"

[dev-dependencies]
criterion = "0.8"
datatest-stable = "0.3"
pretty_assertions = "1.4"

[[test]]
name = "integration_tests"
harness = false

[[bench]]
name = "readability"
harness = false
