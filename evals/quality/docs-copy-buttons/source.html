<!doctype html>
<html lang="en">
  <head>
    <title>Sign a release artifact</title>
    <meta name="description" content="Original synthetic benchmark fixture" />
    <link rel="canonical" href="https://example.test/docs-copy-buttons" />
  </head>
  <body>
    <nav aria-label="Site navigation">Home Topics Account</nav>
    <main>
      <article>
        <h1>Sign a release artifact</h1>
        <p>
          Generate a detached signature for each artifact after checksums are
          final.
        </p>
        <h2>Sign</h2>
        <div class="code-block">
          <button>Copy command</button>
          <pre><code>minisign -Sm package.tar.zst</code></pre>
          <span aria-live="polite">Copied to clipboard</span>
        </div>
        <h2>Verify</h2>
        <div class="code-block">
          <button>Copy command</button>
          <pre><code>minisign -Vm package.tar.zst</code></pre>
        </div>
      </article>
    </main>
  </body>
</html>
