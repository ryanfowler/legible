<!doctype html>
<html>
  <head>
    <title>Traffic report</title>
  </head>
  <body>
    <main>
      <article>
        <h1>Traffic report</h1>
        <p>The chart shows stable request volume after the routing change.</p>
        <svg role="img" aria-labelledby="chart-title">
          <title id="chart-title">Requests per second</title>
          <g>
            <text x="10" y="20">Monday</text>
            <text x="120" y="20">840</text>
            <text x="10" y="40">Tuesday</text>
            <text x="120" y="40">860</text>
          </g>
        </svg>
        <p>
          Decorative search icon must not appear in the extracted chart data.
        </p>
      </article>
    </main>
    <button aria-label="Open chart menu">
      <svg aria-hidden="true">
        <path id="Search icon path" d="M0 0h10"></path>
      </svg>
    </button>
  </body>
</html>
