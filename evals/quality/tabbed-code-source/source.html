      <article>
        <h1>Create a health endpoint</h1>
        <p>Return a stable status field so monitors do not depend on prose.</p>
        <section class="tabs">
          <h2>Go</h2>
          <div role="tabpanel">
            <pre><code class="language-go">func health(w http.ResponseWriter) {
  io.WriteString(w, `{"status":"ok"}`)
}</code></pre>
          </div>
          <h2>JavaScript</h2>
          <div role="tabpanel">
            <pre><code class="language-js">app.get('/health', (_request, response) =&gt; {
  response.json({ status: 'ok' });
});</code></pre>
          </div>
        </section>
      </article>
    </main>
    <button>Open interactive assistant</button>
