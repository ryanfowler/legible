<!doctype html>
<html>
  <head>
    <title>Battery thermal test</title>
    <link rel="icon" href="/favicon.png" />
  </head>
  <body>
    <header><img src="/logo.svg" alt="North Lab logo" /></header>
    <article>
      <h1>Battery thermal test</h1>
      <figure>
        <img
          src="/thermal.png"
          width="900"
          height="600"
          alt="Thermal image of the tested battery module"
        />
        <figcaption>Thermal image of the tested battery module</figcaption>
      </figure>
      <p>
        The module remained below sixty degrees throughout the continuous
        discharge.
      </p>
      <p>
        Temperature variation between cells stayed within the acceptance range.
      </p>
      <img src="/track.gif" width="1" height="1" alt="Tracking pixel" />
    </article>
    <footer>
      <img src="/favicon-copy.png" width="16" height="16" alt="Site favicon" />
    </footer>
  </body>
</html>
