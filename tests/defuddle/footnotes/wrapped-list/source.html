<!doctype html>
<html>
  <head><title>Wrapped footnote list</title></head>
  <body>
    <article>
      <h1>Wrapped footnote list</h1>
      <p>The article points to a note inside a wrapper<sup><a id="fnref-1" href="#fn-1">1</a></sup>.</p>
      <p>The surrounding paragraph provides enough context for the article boundary.</p>
      <section class="footnotes">
        <div id="fn-wrapper">
          <ol><li id="fn-1">The wrapper is structural, but the note remains meaningful. <a href="#fnref-1">↩</a></li></ol>
        </div>
      </section>
    </article>
  </body>
</html>
