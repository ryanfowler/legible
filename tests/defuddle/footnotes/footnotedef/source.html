<!doctype html>
<html>
  <head><title>Article footnote anchors</title></head>
  <body>
    <article>
      <h1>Article footnote anchors</h1>
      <p>A common article anchor points to a definition<sup><a id="footnoteref-1" href="#footnotedef-1" data-footnote-ref="">[1]</a></sup>.</p>
      <p>The surrounding prose stays in the article while the note is normalized.</p>
      <section class="footnotes">
        <ol><li id="footnotedef-1" data-footnote="1">The definition uses a footnotedef target and keeps a <a href="https://example.test/source">source link</a>. <a href="#footnoteref-1" data-footnote-backref="">↩</a></li></ol>
      </section>
    </article>
  </body>
</html>
