<!doctype html>
<html lang="en">
  <head><title>Album photo</title></head>
  <body>
    <main id="root"><button><img src="/photo.jpg" alt="Album photo" width="1200" height="800" /></button></main>
    <template id="delete-dialog">
      <h2>Delete this photo?</h2>
      <p>The photo leaves every album that contains it. People who received a shared link can no longer open it.</p>
      <p>Deleted photos stay in the trash for thirty days. After that time, the photo is removed from all devices.</p>
      <p>You can restore the photo from the trash at any time during those thirty days.</p>
    </template>
  </body>
</html>
