<!doctype html>
<html>
  <head><title>Classic WordPress footnotes</title></head>
  <body>
    <article>
      <h1>Classic WordPress footnotes</h1>
      <p>A classic WordPress anchor points to a note<sup id="fnref-1"><a class="footnote-link" href="#fn-1">[1]</a></sup>.</p>
      <p>The article has enough surrounding text to make the content boundary clear.</p>
      <section class="footnotes">
        <ol><li id="fn-1">The note keeps its <a href="https://example.test/method">method link</a>. <a class="footnote-backref" href="#fnref-1">↩</a></li></ol>
      </section>
    </article>
  </body>
</html>
