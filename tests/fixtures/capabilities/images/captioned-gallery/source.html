      <h1>Field notes from the tide pools</h1>
      <p>We walked the lower shelf at the lowest tide of the month and recorded each pool with a short note and one photograph.</p>
      <div class="gallery-feature">
        <figure>
          <img src="/pools/anemone.jpg" alt="A green anemone in a shallow pool" />
          <figcaption>A green anemone opens in the shallowest pool.</figcaption>
        </figure>
      </div>
      <figure>
        <button class="lightbox" aria-label="Open image viewer">
          <img src="/pools/crab.jpg" width="1200" height="800" alt="A shore crab under a rock ledge" />
        </button>
        <figcaption>A shore crab waits under the rock ledge.</figcaption>
      </figure>
      <p>The second pool held more life than the first because the rock ledge kept it shaded through the afternoon.</p>
