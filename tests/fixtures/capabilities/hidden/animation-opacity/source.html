<!doctype html>
<html>
  <head><title>Animation opacity content</title></head>
  <body>
    <main>
      <article>
        <h1>Animation opacity content</h1>
        <div style="opacity:0; transform:translateY(20px)">
          <p>The first paragraph remains part of the article while a client-side animation starts.</p>
        </div>
        <div style="opacity: 0; transform: translateY(20px)">
          <p>The second paragraph contains the explanation that the extractor must preserve.</p>
        </div>
      </article>
    </main>
  </body>
</html>
