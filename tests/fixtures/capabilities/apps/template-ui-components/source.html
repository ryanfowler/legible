        <h1>Garden soil preparation</h1>
        <p>Test the soil in early spring, when the ground is dry enough to dig without compacting it.</p>
        <p>Add compost in a layer five centimetres deep and work it into the top of the bed.</p>
        <h2>Drainage</h2>
        <p>Raised beds drain faster than flat beds, so they warm earlier in the season.</p>
      </article>
