<!doctype html>
<html>
  <head><title>Album upload</title></head>
  <body>
    <main>
      <div class="file-uploader">
        <h2>Photos</h2>
        <input type="file">
      </div>
    </main>
    <template id="confirm-upload">
      <h2>Confirm your upload</h2>
      <p>We check every photo for size and format before it appears in the shared album.</p>
      <p>You can remove a photo from the album at any time from the photo details page.</p>
      <p>Large uploads can take several minutes to finish on a slow connection.</p>
    </template>
  </body>
</html>
