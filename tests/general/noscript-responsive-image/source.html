<!doctype html>
<html>
<head><title>Responsive image recovery</title></head>
<body>
<main>
  <h1>Responsive image recovery</h1>
  <p>The article explains how the recovered diagram supports the final result.</p>
  <figure>
    <img src="placeholder.gif" alt="Recovered chart">
    <noscript>
      <picture>
        <source srcset="images/chart-small.webp 400w, images/chart-large.webp 1200w">
        <img src="images/chart.jpg">
      </picture>
    </noscript>
    <figcaption>The fallback picture keeps its responsive source and description.</figcaption>
  </figure>
</main>
</body>
</html>
