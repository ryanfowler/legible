name: Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  benchmark:
    name: Compare Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install critcmp
        run: cargo install critcmp --locked

      - name: Benchmark changes
        run: cargo bench --bench extraction -- --save-baseline changes

      - name: Check out base branch
        run: git checkout --detach "origin/${GITHUB_BASE_REF}"

      - name: Benchmark base
        run: cargo bench --bench extraction -- --save-baseline base

      - name: Compare benchmarks
        run: |
          comparison="$(critcmp base changes)"
          echo "$comparison"
          {
            echo "## Benchmark comparison"
            echo
            echo '```text'
            echo "$comparison"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
