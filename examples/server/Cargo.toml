[package]
name = "legible-server"
version = "0.1.0"
edition = "2024"
description = "HTTP server for the Legible article extraction library"
license = "Apache-2.0"

[dependencies]
legible = { path = "../.." }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
ammonia = "4"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
url = "2.5"
ipnet = "2.10"
once_cell = "1.19"
