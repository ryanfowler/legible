[package]
name = "legible-cli"
version = "0.5.1"
edition = "2024"
authors = ["Ryan Fowler"]
description = "Fetch web pages and render them as Markdown with Legible"
license = "Apache-2.0"
repository = "https://github.com/ryanfowler/legible"

[[bin]]
name = "legible"
path = "src/main.rs"

[dependencies]
encoding_rs = "0.8"
legible = { path = ".." }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "brotli",
    "deflate",
    "gzip",
    "rustls-tls",
    "zstd",
] }
serde_json = "1.0"
terminal_size = "0.4"
url = "2.5"
