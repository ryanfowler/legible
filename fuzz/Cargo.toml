[package]
name = "legible-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
default = ["fuzzing"]
fuzzing = []

# A target includes library source files that have optional serde attributes.
# The fuzz crate has no serde feature, so declare the cfg value as expected.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("serde"))'] }

[dependencies]
html5ever = "0.40"
legible = { path = "..", features = ["fuzzing"] }
libfuzzer-sys = "0.4"
memchr = "2.8"
smallvec = "1.15"
tendril = "0.5"

[[bin]]
name = "document_parse"
path = "fuzz_targets/document_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dom_mutation_serialization"
path = "fuzz_targets/dom_mutation_serialization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render_markdown_text"
path = "fuzz_targets/render_markdown_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_ld_metadata"
path = "fuzz_targets/json_ld_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "url_rewriting"
path = "fuzz_targets/url_rewriting.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nested_malformed_html"
path = "fuzz_targets/nested_malformed_html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "semantic_normalization"
path = "fuzz_targets/semantic_normalization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extractor_options"
path = "fuzz_targets/extractor_options.rs"
test = false
doc = false
bench = false
